<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      /* Verbatim visuals from нОВЫЙ ЗАДНИЙ ФОН/фон задний.html — only the time
         source is changed: animation progress is driven by the parent's scroll
         (window.__setBgProgress), never autoplay. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; background: #0a0a0a; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="stage" style="position: fixed; inset: 0; width: 100vw; height: 100vh; background: #0a0a0a; overflow: hidden;">
      <!-- grid -->
      <div style="position:absolute; inset:0;
        background-image:
          linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
        background-size: 96px 96px; background-position: -1px -1px;
        -webkit-mask-image: radial-gradient(ellipse 75% 75% at 50% 50%, #000 55%, transparent 100%);
        mask-image: radial-gradient(ellipse 75% 75% at 50% 50%, #000 55%, transparent 100%);"></div>
      <!-- soft glow -->
      <div style="position:absolute; inset:0; background: radial-gradient(ellipse 40% 40% at 50% 48%, rgba(255,255,255,0.02), transparent 70%);"></div>
    </div>

    <script>
      (function () {
        var SPHERES = [
          { size: 300, phase: 0.60, rr: 1.0, morph: 0.0 },
          { size: 230, phase: 0.08, rr: 0.92, morph: 1.4 },
          { size: 180, phase: 0.86, rr: 1.05, morph: 2.7 },
          { size: 140, phase: 0.34, rr: 0.8, morph: 4.1 },
          { size: 105, phase: 0.52, rr: 1.12, morph: 5.5 },
        ];
        var SPHERE_BG =
          'radial-gradient(circle at 44% 16%, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0) 14%),' +
          'radial-gradient(circle at 46% 24%, #9a9a9d 0%, #6a6a6d 16%, #3a3a3d 38%, #1c1c1e 60%, #0d0d0e 82%, #060607 100%),' +
          'radial-gradient(circle at 62% 92%, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 42%)';

        var stage = document.getElementById('stage');
        var nodes = SPHERES.map(function (s) {
          var el = document.createElement('div');
          el.style.cssText =
            'position:absolute; left:50%; top:50%; width:' + s.size + 'px; height:' + s.size +
            'px; border-radius:50%; transform: translate(-50%,-50%); background:' + SPHERE_BG +
            '; will-change: transform, border-radius;';
          stage.appendChild(el);
          return el;
        });

        // Scroll drives the animation clock. t (seconds) = progress * SPAN.
        var SPAN = 14; // total "seconds" of motion across the whole page
        var progress = 0;
        window.__setBgProgress = function (p) {
          progress = Math.max(0, Math.min(1, p || 0));
        };

        function render() {
          var w = stage.clientWidth || window.innerWidth;
          var h = stage.clientHeight || window.innerHeight;
          var rx = w * 0.3, ry = h * 0.46;
          var t = progress * SPAN;
          for (var i = 0; i < nodes.length; i++) {
            var cfg = SPHERES[i], el = nodes[i];
            var ang = cfg.phase * Math.PI * 2 + t * 0.4;
            var x = Math.cos(ang) * rx * cfg.rr;
            var y = Math.sin(ang) * ry * cfg.rr;
            var depth = (Math.sin(ang) + 1) / 2;
            var dScale = 0.88 + depth * 0.18;
            var pScale = 1 + 0.05 * Math.sin(t * 0.9 + i);
            var scale = dScale * pScale;
            var bright = 0.55 + depth * 0.45;
            var m = t * 0.5 + cfg.morph;
            var a = 50 + 14 * Math.sin(m);
            var b = 50 + 14 * Math.sin(m + 2.1);
            var c = 50 + 12 * Math.sin(m + 4.0);
            var d = 50 + 12 * Math.sin(m + 1.3);
            var rot = 6 * Math.sin(m * 0.7);
            el.style.borderRadius =
              a + '% ' + (100 - a) + '% ' + c + '% ' + (100 - c) + '% / ' +
              b + '% ' + d + '% ' + (100 - d) + '% ' + (100 - b) + '%';
            el.style.transform =
              'translate(-50%,-50%) translate(' + x + 'px,' + y + 'px) rotate(' + rot.toFixed(2) +
              'deg) scale(' + scale.toFixed(3) + ')';
            el.style.zIndex = String(Math.round(depth * 100));
            el.style.filter = 'brightness(' + bright.toFixed(2) + ') blur(0.4px)';
            var sh = 20 + depth * 34;
            el.style.boxShadow =
              'inset -8px -12px 40px rgba(0,0,0,0.6), 0 ' + sh.toFixed(0) + 'px ' +
              (sh * 1.8).toFixed(0) + 'px rgba(0,0,0,' + (0.35 + depth * 0.25).toFixed(2) + ')';
          }
          requestAnimationFrame(render);
        }
        requestAnimationFrame(render);
      })();
    </script>
  </body>
</html>
